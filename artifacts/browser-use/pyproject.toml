[project]
name = "browser-use"
description = "Browser-use microservice for TestRadius"
authors = [{ name = "Marcus Quinn" }]
version = "0.1.0"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=7.0.0",
    "pydantic-settings>=2.0.0",
    "bubus>=1.5.0",
    "cdp-use>=1.4.0",
    "pyotp>=2.9.0",
    "markdownify>=1.2.0",
    "imageio>=2.36.0",
    "imageio-ffmpeg>=0.5.1",
    "numpy>=2.0.0",
    "Pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpserver>=1.1.0",
]

[project.scripts]
browser-use-server = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "*.py",
]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I"]
unfixable = ["E501"]

[tool.pyright]
typeCheckingMode = "basic"
